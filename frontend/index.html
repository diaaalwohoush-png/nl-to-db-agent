<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NL to Database Agent</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }
    h1 { color: #333; }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      margin-top: 10px;
      padding: 12px 24px;
      font-size: 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #45a049; }
    #answer-box {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #ddd;
      display: none;
    }
    #answer { font-size: 18px; color: #222; }
    #steps {
      margin-top: 15px;
      font-size: 13px;
      color: #666;
      white-space: pre-wrap;
      background: #f9f9f9;
      padding: 10px;
      border-radius: 4px;
    }
    #loading { margin-top: 20px; color: #888; display: none; }
  </style>
</head>
<body>
  <h1>🔍 Ask the Database</h1>
  <p>Type a question in plain English and get an answer from the Chinook database.</p>

  <input type="text" id="question" placeholder="e.g. How many customers are in Germany?" />
  <br/>
  <button onclick="askQuestion()">Ask</button>

  <div id="loading">⏳ Thinking...</div>

  <div id="answer-box">
    <strong>Answer:</strong>
    <p id="answer"></p>
    <strong>SQL Steps:</strong>
    <div id="steps"></div>
  </div>

  <script>
    async function askQuestion() {
      const question = document.getElementById("question").value;
      if (!question) return;

      document.getElementById("loading").style.display = "block";
      document.getElementById("answer-box").style.display = "none";

      const response = await fetch("http://127.0.0.1:8000/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question })
      });

      const data = await response.json();

      document.getElementById("loading").style.display = "none";
      document.getElementById("answer-box").style.display = "block";
      document.getElementById("answer").innerText = data.answer;
      document.getElementById("steps").innerText = data.steps;
    }
  </script>
</body>
</html>
